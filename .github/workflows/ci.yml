name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: |
          docker compose --profile verify config > /dev/null

      - name: Build verification images
        run: |
          docker compose --profile verify build api-verify frontend-verify

      - name: Verify Go backend
        run: |
          docker compose --profile verify run --rm api-verify

      - name: Verify frontend workspace
        run: |
          docker compose --profile verify run --rm frontend-verify

      - name: Stop verification services
        if: always()
        run: |
          docker compose --profile verify down --remove-orphans

      - name: Build and start runtime stack
        run: |
          docker compose up -d --build

      - name: Wait for runtime health checks
        shell: bash
        run: |
          set -euo pipefail

          wait_for_health() {
            service="$1"
            attempts=90

            echo "Waiting for $service..."

            for attempt in $(seq 1 "$attempts"); do
              container_id="$(docker compose ps -q "$service")"

              if [ -z "$container_id" ]; then
                echo "$service container has not been created yet"
                sleep 2
                continue
              fi

              status="$(docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$container_id")"

              echo "$service: $status"

              if [ "$status" = "healthy" ]; then
                return 0
              fi

              if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ]; then
                echo "$service failed"
                docker logs "$container_id" || true
                return 1
              fi

              sleep 2
            done

            echo "$service did not become healthy in time"
            docker compose logs --no-color "$service" || true
            return 1
          }

          wait_for_health postgres
          wait_for_health redis
          wait_for_health api
          wait_for_health web
          wait_for_health mobile

      - name: Verify migration result
        shell: bash
        run: |
          set -euo pipefail

          migrate_id="$(docker compose ps -a -q migrate)"

          if [ -z "$migrate_id" ]; then
            echo "Migration container was not found"
            exit 1
          fi

          exit_code="$(docker inspect \
            --format='{{.State.ExitCode}}' \
            "$migrate_id")"

          echo "Migration exit code: $exit_code"

          if [ "$exit_code" != "0" ]; then
            docker logs "$migrate_id" || true
            exit 1
          fi

      - name: Verify API endpoint
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:3001/api/health

      - name: Verify web endpoint
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:3000 \
            > /dev/null

      - name: Verify Expo development server
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8081/status)"

          echo "$response"

          echo "$response" | grep -q "packager-status:running"

      - name: Show Docker status
        if: always()
        run: |
          docker compose ps -a

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose logs --no-color || true

      - name: Stop runtime stack
        if: always()
        run: |
          docker compose down --remove-orphans
