name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kampushub_test
          POSTGRES_USER: kampushub
          POSTGRES_PASSWORD: kampushub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kampushub -d kampushub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kampushub:kampushub@localhost:5432/kampushub_test?sslmode=disable
      JWT_ACCESS_SECRET: ci-access-secret-kampushub-minimum-length
      JWT_REFRESH_SECRET: ci-refresh-secret-kampushub-different-value
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      EXPO_PUBLIC_API_URL: http://localhost:3001/api
      DASHBOARD_UPCOMING_DAYS: 14
      HOST: 0.0.0.0
      PORT: 3001
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/migrations/20260726161333_init/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/migrations/20260803172740_initial_asistenakademik/migration.sql

      - name: Install Go dependencies
        working-directory: apps/api
        run: go mod download

      - name: Verify Go backend
        working-directory: apps/api
        run: |
          go vet ./...
          go test ./...
          go build ./...

      - name: Verify frontend workspace
        run: pnpm verify

      - name: Verify shared package outputs
        run: |
          test -f packages/contracts/dist/index.js
          test -f packages/contracts/dist/index.d.ts
          test -f packages/validation/dist/index.js
          test -f packages/validation/dist/index.d.ts
          test -f packages/api-client/dist/index.js
          test -f packages/api-client/dist/index.d.ts

      - name: Generate Expo routes and bundle
        run: pnpm --filter mobile exec expo export --platform web --output-dir dist-ci