name: asisten-akademik

x-node-build: &node-build
  context: .
  dockerfile: Dockerfile
  target: development

x-api-environment: &api-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-kampushub}:${POSTGRES_PASSWORD:-kampushub}@postgres:5432/${POSTGRES_DB:-kampushub}?sslmode=disable
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-kampushub-change-me}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-kampushub-change-me}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
  GRADE_SCALE: ${GRADE_SCALE:-}
  DASHBOARD_UPCOMING_DAYS: ${DASHBOARD_UPCOMING_DAYS:-14}
  HOST: 0.0.0.0
  PORT: 3001

services:
  postgres:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kampushub}
      POSTGRES_USER: ${POSTGRES_USER:-kampushub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kampushub}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-kampushub} -d ${POSTGRES_DB:-kampushub}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: "no"
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kampushub}:${POSTGRES_PASSWORD:-kampushub}@postgres:5432/${POSTGRES_DB:-kampushub}?sslmode=disable
    volumes:
      - ./apps/api/migrate.sh:/migrate.sh:ro
      - ./apps/api/prisma/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - /migrate.sh

  api:
    image: asisten-akademik-api:dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
    init: true
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      APP_ENV: development
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3001/api/health > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  web:
    image: asisten-akademik-web:dev
    build: *node-build
    init: true
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
    command:
      - sh
      - -c
      - >
        pnpm --filter @kampushub/contracts build &&
        pnpm --filter @kampushub/validation build &&
        pnpm --filter @kampushub/api-client build &&
        pnpm --filter web exec next dev -H 0.0.0.0 -p 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:3000 > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mobile:
    image: asisten-akademik-mobile:dev
    build: *node-build
    init: true
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://10.0.2.2:3001/api}
      EXPO_PACKAGER_PROXY_URL: http://${EXPO_DEV_HOST:-10.0.2.2}:${EXPO_PORT:-8081}
      NODE_ENV: development
      TERM: xterm-256color
    command:
      - sh
      - -c
      - >
        pnpm --filter @kampushub/contracts build &&
        pnpm --filter @kampushub/validation build &&
        pnpm --filter @kampushub/api-client build &&
        pnpm --filter mobile exec expo start --lan --port 8081
    ports:
      - "${EXPO_PORT:-8081}:8081"
    stdin_open: true
    tty: true
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8081/status | grep -q "packager-status:running"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  api-verify:
    profiles:
      - verify
    image: asisten-akademik-api-verify:dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: verify
    init: true
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      APP_ENV: test

  frontend-verify:
    profiles:
      - verify
    image: asisten-akademik-frontend-verify:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: verify
    init: true
    restart: "no"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://10.0.2.2:3001/api}
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"

volumes:
  postgres_data:
  redis_data:
